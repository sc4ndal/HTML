<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8. 내장객체</title>
    <script>
        // Number() : 숫자로 변환
        console.log(Number("10"));
        console.log(Number(" 10 "));        // 공백 무시
        console.log(Number("10.33"));
        console.log(Number(true));          // 1
        console.log(Number(false));         // 0
        console.log(Number("false"));       // NaN    숫자로 변환 불가
        console.log(Number("10,33"));       // NaN    숫자로 변환 불가

        // 숫자를 다듬는 메서드
        {
            let price = 1234567;
            let pi = 3.14159;

            console.log("소수점 표현 : ",pi.toFixed(2));     // 소수점 2자리까지 표현
            console.log("천단위 , : ",price.toLocaleString());    // 천단위 숫자 표현 1,234,567
            console.log("16진수 표현 : ",(255).toString(16));    // 16진수 표현
            
        }
        
        // Math
        console.log(Math.round(4.5));   // 반올림
        console.log(Math.floor(4.5));   // 내림
        console.log(Math.max(1,3,2));   // 최대값
        console.log(Math.sqrt(16));     // 제곱근
        console.log(Math.PI);           // 원주율

        console.log(Math.floor(Math.random() * 6)+1);   // 랜덤

        // Date : 날짜 정보
        {
            let now = new Date("2026-06-01T10:30:00");
            console.log(now);
            console.log(now.getFullYear(),"년");
            console.log(now.getMonth()+1,"월"); // 월은 0부터 시작하는 배열처럼 돼잇어서 +1 해줘야함
            console.log(now.getDate(),"일");
            console.log(now.getHours(),"시");
            
            
        }
        // 실습 : 현재 날짜를 YYYY-MM-DD 형식으로 출력
        {
        let now = new Date();
        let year = now.getFullYear();
        // String(값).padStart(길이, 채울문자) -> 문자열 값으로 환하고 앞에 채워줌?
        let month = String(now.getMonth()+1).padStart(2, "0");
        let date = String(now.getDate()).padStart(2, "0");

        console.log(`${year}-${month}-${date}`);
        
        // console.log(`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`);
        }

        // 전역함수 (parseInt, parseFloat, isNaN)
        console.log(parseInt("42px"));    // 숫자만 추출
        console.log(parseFloat("3.14rem"));    // 소수점으로만 추출
        console.log(parseInt("1abc1"));     // 제일 첫자리 수에 숫자가 들어와야됨
        console.log(isNaN("hello"));        // 숫자로 변환되는지 확인 -> true
        console.log(isNaN("123"));        // 숫자 변환이 안됨 -> false
    </script>
</head>
<body>
    
</body>
</html>
