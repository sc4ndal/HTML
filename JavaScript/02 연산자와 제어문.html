<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2 연산자와 제어문</title>
    <script>
      //산술연산자, 비교연산자
      // 문자열 이어붙이기
      let greeting = "Hello, ";
      let name = "Alice";
      console.log(greeting, name);
      console.log(greeting + name);
      console.log(5 + 5);
      console.log(5 + "5");

      // 문자열 함수
      let str = "Hello, World!";
      console.log(str.length); // 문자열 길이 반환
      console.log(str.charAt(5)); // index 위치에 해당하는 문자 반화
      console.log(str.includes("World")); // 특정 문자열 포함
      console.log(str.indexOf("World")); // 인덱스값 반환
      console.log(str.substring(4, 0)); // 0번부터 4번 인덱스까지
      console.log(str.toUpperCase()); // 대문자 변환
      console.log(str.toLowerCase()); // 소문자 변환
      console.log(str.replace("World", "JS")); // Wolrd 를 JS로 변환
      console.log(str);
      console.log("a,b,c".split(",")); // , 기준으로 쪼갬

      // 템플릿 리터럴
      name = "홍길동";
      age = 20;
      console.log("제 이름은", name, "이고, 나이는 ", age, "살입니다.");
      console.log(`제 이름은 ${name}이고, 나이는 ${age}살입니다.`);

      let multi = "첫번째 줄 \n두번째 줄";
      console.log(multi);

      // 조건문
      // let score = prompt("점수를 입력하세요 : ");
      function whatrank(score) {
        if (score >= 90) {
        //   console.log("A등급");
          alert("A등급");
        } else if (score >= 80) {
          console.log("B등급");
          alert("B등급");
        } else {
          alert("C등급");
        }
      }

      // 반복문
      // 1~10 사이의 정수의 합을 구하시오
      // for(초기값; 조건식; 증감식){조건식 true일 동안 반복될 문장}
    //   let sum=0;
    function whatsum(sumnum){
      for (let i = 1; i <= sumnum; i++) {
        sumnum+=i;
        console.log(sumnum);
        
      }
    //   console.log(sumnum);
    }


      console.log("------------------------------");
      
      let a = 10;
      while (true) {
        console.log(a--);
        
        if(a==0){
            break;
        }
        
      }
      console.log("----------------------------");
      
      let c = 10;
      do {
        console.log(c);
        c--;
      } while (c!=0);
      
    </script>
  </head>
  <body>
    <label for="score"></label>
    <input type="text" name="score" id="score" />
    <button onclick="whatrank(document.getElementById('score').value)">등급확인</button>
    <br><br>
    <label for="sumnum"></label>
    <input type="text" name="sumnum" id="sumnum" placeholder="1에서 몇까지 더할까요?" />
    <button onclick="whatsum(document.getElementById('sumnum').value)">더하기</button>
  
  </body>
</html>
