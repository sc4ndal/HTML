<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01 CSS 기본</title>
        <!-- 외부 스타일 시트 불러오기 -->
     <link rel="stylesheet" href="style.css">
    <style>
        h2{
            color: rgb(47, 0, 255);
            font-size: 15px;
        }

        /* 주석 */
        p{
            color: deepskyblue;
        }
    </style>



  </head>
  <body>
    <h1>CSS 적용 방법</h1>

    <!-- 방법 1 인라인 스타일 : 태그에 직접 style 속성 지정 -->
    <h2 style="color: red; font-size: 30px;">인라인 스타일</h2>
    <p style="font-weight: bold; color: coral;">이 라인은 인라인 스타일로 굵게 표시됩니다.</p>

    <!-- 방법 2 내부 스타일 스타일 -->
    <h2>내부 스타일 시트</h2>
    <p style="font-weight: bold">이 라인은 내부 스타일 시트 규칙&lt;style&gt;&nbsp;&nbsp;&nbsp;&nbsp;으로 만들어졌습니다.</p>

    <!-- 방법 3 외부 스타일 스타일 -->
    <h2>외부 스타일 시트</h2>
    <p>이 라인은 내부 스타일 시트 규칙&lt;style&gt;&nbsp;&nbsp;&nbsp;&nbsp;으로 만들어졌습니다.</p>

    

  </body>
</html>
