<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록스타일</title>
    <style>
        ul{
            list-style-type: "✅";
            list-style-position: inside;
            /* list-style-image: url(); */
            color: red;
            
            
        }
        ol{
            list-style-type: upper-roman;
        }
    </style>
</head>
<body>
    <h2>순서가 없는 목록</h2>
    <ul>
        <li>사과</li>
        <li>바나나</li>
        <li>참외</li>
    </ul>

    <hr>
    
    <h2>순서가 있는 목록</h2>
    <ol>
       <li>문</li> 
       <li>창</li> 
       <li>호</li> 
    </ol>
</body>
</html>
