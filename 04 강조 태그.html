<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04. 강조 태그</title>
</head>
<body>
    <p><strong>중요한 내용</strong>입니다.</p>
    <p><b>굵은 글씨</b>입니다.</p>
    <p><em>강조된 내용</em> 입니다.</p>
    <p><i>강조된 내용</i> 입니다.</p>
</body>
</html>
