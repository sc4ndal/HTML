<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블</title>
</head>
<body>
    <h3>테이블 기본</h3>
    <table width="500" border="1" style="font-size: 30pt;">
        <tr>
            <!-- th는 테이블 컬럼(열) 제목 지정하는 태그 -->
            <th>컬럼1</th>
            <th>컬럼2</th>
            <th>컬럼3</th>
        </tr>
        <tr>
            <!-- 행1 -->
            <td style="color: red;">셀1</td>
            <td style="color: orange;">셀2</td>
            <td style="color: yellow;">셀3</td>
        </tr>
        <tr>
            <!-- 행2 -->
            <td style="color: green;">셀4</td>
            <td style="color: blue;">셀5</td>
            <td style="color: purple;">셀6</td>
        </tr>
    </table>
    <h3>셀 합치기</h3>
    <!-- 셀 병합 -->
    <table border="1" width="100">
        <tr>
            <td colspan="3">1</td>
            <!-- <td>2</td>
            <td>3</td> -->
        </tr>
        <tr>
            <td rowspan="2">4</td>
            <td rowspan="2" colspan="2">5</td>
            <!-- <td>6</td> -->
        </tr>
        <tr>
            <!-- <td>7</td> -->
            <!-- <td>8</td> -->
            <!-- <td>9</td> -->
        </tr>
    </table>

    <h3>표 구조 정의하기</h3>
    <table style="text-align: right;" width="300" border="1">
        <caption>학생 성적표</caption>
        <thead>
            <tr>
                <th scope="col">이름</th>
                <th scope="col">국어</th>
                <th scope="col">영어</th>
                <th scope="col">수학</th>
                <th scope="col">평균</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>김철수</td>
                <td>85</td>
                <td>90</td>
                <td>78</td>
                <td>84.3</td>
            </tr>
            <tr>
                <td>이영희</td>
                <td>92</td>
                <td>88</td>
                <td>95</td>
                <td>91.7</td>
            </tr>            <tr>
                <td>박민수</td>
                <td>76</td>
                <td>82</td>
                <td>89</td>
                <td>82.3</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>합계</td>
                <td>253</td>
                <td>260</td>
                <td>262</td>
                <td>258.3</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
